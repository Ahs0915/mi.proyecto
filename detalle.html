<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle - Maison Sucrée</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-white fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand font-serif" href="index.html">Maison Sucrée</a>
            <a href="index.html" class="btn btn-outline-dark btn-sm">Volver al Inicio</a>
        </div>
    </nav>

    <div style="margin-top: 100px;"></div>

    <div class="container py-5">
        <div class="row align-items-center bg-white p-4 rounded-4 shadow-sm">
            <div class="col-md-6 text-center mb-4 mb-md-0">
                <img id="imgProducto" src="" alt="Postre" class="img-fluid rounded-4 shadow-sm w-100" style="max-height: 400px; object-fit: cover;">
            </div>
            <div class="col-md-6 ps-md-5">
                <span class="text-uppercase tracking-wide small text-muted">Detalles del Producto</span>
                <h1 id="tituloProducto" class="font-serif display-5 my-2">Cargando...</h1>
                <h3 id="precioProducto" class="text-dark font-serif mb-3">$0</h3>
                <p id="descProducto" class="text-secondary mb-4">Cargando descripción...</p>
                
                <div class="p-3 bg-light rounded-3 mb-3">
                    <strong class="small text-dark d-block mb-1">🌾 Ingredientes principales:</strong>
                    <!-- Aquí se pintarán los ingredientes personalizados -->
                    <span class="small text-muted" id="ingredientesProducto">Cargando ingredientes...</span>
                </div>

                <div class="p-3 bg-light rounded-3 mb-4">
                    <strong class="small text-dark d-block mb-1">✨ Sabores disponibles:</strong>
                    <!-- Aquí se pintarán los sabores personalizados -->
                    <span class="small text-muted" id="saboresProducto">Cargando sabores...</span>
                </div>
                
                <a href="index.html#pedidos" class="btn btn-primary-custom w-100 py-2">Hacer Pedido de este Producto</a>
            </div>
        </div>
    </div>

    <!-- Script inteligente que lee TODO de la dirección web -->
    <script>
        const params = new URLSearchParams(window.location.search);
        
        if (params.get('nombre')) document.getElementById('tituloProducto').textContent = params.get('nombre');
        if (params.get('precio')) document.getElementById('precioProducto').textContent = params.get('precio');
        if (params.get('desc')) document.getElementById('descProducto').textContent = params.get('desc');
        if (params.get('img')) document.getElementById('imgProducto').src = params.get('img');
        if (params.get('ing')) document.getElementById('ingredientesProducto').textContent = params.get('ing');
        if (params.get('sab')) document.getElementById('saboresProducto').textContent = params.get('sab');
    </script>
</body>
</html>
